name: Android build
on:
  workflow_dispatch:
    inputs:
      release:
        description: Build signed release APK
        type: boolean
        default: false
  pull_request:
    paths: ['android/**', '.github/workflows/android-build.yml']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: rts-business-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Build signed release APK
        if: github.event_name == 'workflow_dispatch' && inputs.release
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          FCM_APP_ID: ${{ vars.FCM_APP_ID }}
          FCM_PROJECT_ID: ${{ vars.FCM_PROJECT_ID }}
          FCM_SENDER_ID: ${{ vars.FCM_SENDER_ID }}
          FCM_API_KEY: ${{ vars.FCM_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64" && test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS" && test -n "$ANDROID_KEY_PASSWORD"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > signing.p12
          trap 'rm -f signing.p12' EXIT
          export ANDROID_KEYSTORE_PATH="$PWD/signing.p12"
          gradle --no-daemon assembleRelease
          verification=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/*.apk)
          printf '%s\n' "$verification"
          fingerprint=$(printf '%s\n' "$verification" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr -d ':' | tr '[:upper:]' '[:lower:]')
          test "$fingerprint" = "787f3b4a070715c46bda0d557046e92b675e18bdfbef90b19633fd2ec49c7177"
      - name: Upload signed release APK
        if: github.event_name == 'workflow_dispatch' && inputs.release
        uses: actions/upload-artifact@v4
        with:
          name: rts-business-android-release
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
